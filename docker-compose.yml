version: "3.9"

services:
  backend:
    image: ghcr.io/watsonlimprevil/finance-backend:v1
    container_name: finance-backend
    ports:
      - "5000:3000"
    environment:
      NODE_ENV: production
    networks:
      - app-network

  frontend:
    image: ghcr.io/watsonlimprevil/finance-frontend:v1
    container_name: finance-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  postgres:
    image: postgres:15
    container_name: finance-postgres
    restart: always
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_pass
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  uptime_kuma_data:
