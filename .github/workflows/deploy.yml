name: Deploy Finance App

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd finance-frontend
          npm ci

      - name: Build Frontend
        run: |
          cd finance-frontend
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd finance-backend
          npm ci

  validate:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose config

  test-ghcr-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Test GHCR Login
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

  codeql-analysis:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Initialize codeql
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  security-scan:
    needs: codeql-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Backend Dependencies
        run: |
          cd finance-backend
          npm audit --audit-level=high

      - name: Audit Frontend Dependencies
        run: |
          cd finance-frontend
          npm audit --audit-level=high

  build-backend-image:
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login To GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build Backend Image
        run: |
          docker build \
          -t ghcr.io/watsonlimprevil/finance-backend:latest \
          -t ghcr.io/watsonlimprevil/finance-backend:${{ github.sha }} \
          -f finance-backend/Dockerfile \
          ./finance-backend

      - name: Push Backend Image
        run: |
          docker push ghcr.io/watsonlimprevil/finance-backend:latest

          docker push ghcr.io/watsonlimprevil/finance-backend:${{ github.sha }}

  build-frontend-image:
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login To GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build Frontend Image
        run: |
          docker build \
            -t ghcr.io/watsonlimprevil/finance-frontend:latest \
            -t ghcr.io/watsonlimprevil/finance-frontend:${{ github.sha }} \
            -f finance-frontend/Dockerfile \
            ./finance-frontend

      - name: Push Frontend Image
        run: |
          docker push ghcr.io/watsonlimprevil/finance-frontend:latest

          docker push ghcr.io/watsonlimprevil/finance-frontend:${{ github.sha }}

  container-security-scan:
    needs:
      - build-backend-image
      - build-frontend-image

    runs-on: ubuntu-latest

    steps:
      - name: Login To GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

          docker pull ghcr.io/watsonlimprevil/finance-backend:latest

      - name: Run Trivy Backend scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/watsonlimprevil/finance-backend:latest
          format: table
          severity: "HIGH,CRITICAL"

      - name: Run Trivy Frontend scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/watsonlimprevil/finance-frontend:latest
          format: table
          severity: "HIGH,CRITICAL"

  deploy:
    needs:
      - container-security-scan

    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add VPS To Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Images
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "
          set -e

          cd /root/finance-app

          echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin'

          docker pull ghcr.io/watsonlimprevil/finance-backend:latest

          docker pull ghcr.io/watsonlimprevil/finance-frontend:latest

          docker compose pull

          docker compose up -d

          docker ps
          "

  verify:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify Frontend
        run: |
          curl -I https://${{ secrets.SSH_HOST }}

      - name: Verify Backend
        run: |
          curl -I https://${{ secrets.SSH_HOST }}/api

  diagnostics:
    if: failure()

    needs:
      - build
      - validate
      - codeql-analysis
      - security-scan
      - build-backend-image
      - build-frontend-image
      - container-security-scan
      - deploy
      - verify

    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add VPS To Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Collect Logs
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "
          docker logs finance-backend --tail 50

          docker logs finance-frontend --tail 50
          "
