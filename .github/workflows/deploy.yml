name: Deploy Finance App

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd finance-frontend
          npm ci

      - name: Build Frontend
        run: |
          cd finance-frontend
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd finance-backend
          npm ci

  validate:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose config

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add VPS To Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy To VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "
          set -e

          cd /root/finance-app

          echo '=== Pulling Latest Code ==='
          git pull

          echo '=== Rebuilding Containers ==='
          docker-compose up -d --build

          echo '=== Running Containers ==='
          docker ps

          echo '=== Inspecting Container Health ==='
          docker inspect -f '{{.State.Running}}' finance-backend
          docker inspect -f '{{.State.Running}}' finance-frontend
          docker inspect -f '{{.State.Running}}' finance-postgres
          "

  verify:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify Frontend
        run: |
          curl -I https://${{ secrets.SSH_HOST }}

      - name: Verify Backend
        run: |
          curl -I https://${{ secrets.SSH_HOST }}/api

  diagnostics:
    if: failure()

    needs:
      - build
      - validate
      - deploy
      - verify

    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add VPS To Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Collect Logs
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "
          echo '=== Backend Logs ==='
          docker logs finance-backend --tail 50

          echo '=== Frontend Logs ==='
          docker logs finance-frontend --tail 50
          "
